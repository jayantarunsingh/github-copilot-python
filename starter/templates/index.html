<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>

  <div class="top-controls">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <label for="dark-mode-toggle" class="dark-toggle-label">Dark Mode</label>
    <input id="dark-mode-toggle" type="checkbox" aria-label="Toggle dark mode">
    <label for="player-name">Player:</label>
    <input id="player-name" type="text" placeholder="Your name" maxlength="20">
    <button id="new-game">New Game</button>
    <button id="check-solution">Check Solution</button>
    <button id="hint-button">Hint</button>
  </div>

  <div class="status-bar">
    <span id="timer">Time: 00:00</span>
    <span id="hints-used">Hints: 0</span>
    <span id="message"></span>
  </div>

  <div id="sudoku-board"></div>

  <div class="scoreboard">
    <h2>Top 10 Scoreboard</h2>
    <div id="scoreboard"></div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
